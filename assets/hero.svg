<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">lidawake</title>
  <desc id="description">A closed laptop stays awake beneath a moonlit sky.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#101b44"/>
      <stop offset=".55" stop-color="#333080"/>
      <stop offset="1" stop-color="#13799a"/>
    </linearGradient>
    <linearGradient id="lid" x2="1" y2="1">
      <stop stop-color="#d6f6ff"/>
      <stop offset="1" stop-color="#80bfea"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#sky)"/>
  <circle cx="978" cy="64" r="104" fill="#63dce8" opacity=".11" filter="url(#glow)"/>
  <circle cx="969" cy="67" r="32" fill="#dcfaff"/>
  <circle cx="982" cy="55" r="32" fill="#304785"/>
  <g fill="#d8f9ff" opacity=".75">
    <circle cx="737" cy="55" r="2"/>
    <circle cx="813" cy="119" r="1.5"/>
    <circle cx="1103" cy="145" r="2"/>
    <circle cx="1047" cy="39" r="1.5"/>
  </g>

  <text x="72" y="137" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="700" letter-spacing="-3">lidawake</text>
  <text x="76" y="190" fill="#bdebf5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Close the lid. Keep the work going.</text>
  <path d="M76 228h162" stroke="#72f2d2" stroke-width="6" stroke-linecap="round"/>

  <ellipse cx="927" cy="268" rx="210" ry="18" fill="#07163b" opacity=".45"/>
  <path d="M777 195l303-21 48 62-301 19z" fill="url(#lid)" stroke="#d6f6ff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M827 255l301-19-20 19-286 18-45-22z" fill="#5588c0"/>
  <path d="M777 251l45 22 286-18" fill="none" stroke="#bfefff" stroke-width="3" stroke-linecap="round"/>
  <path d="M895 211l53-4" stroke="#2b638f" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  <circle cx="1094" cy="244" r="5" fill="#72f2d2"/>
</svg>
